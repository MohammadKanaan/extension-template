<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Extension Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>
          <span class="title__name" id="app-name">My Extension</span> Settings
        </h1>
        <p>A cross-browser WebExtension.</p>
      </header>

      <section class="panel" aria-labelledby="general-heading">
        <h2 class="ui-visually-hidden" id="general-heading">General</h2>
        <div class="setting-row">
          <label class="switch-label" for="enabled-by-default">
            <span class="setting-title">Enabled by default</span>
            <span class="setting-desc"
              >Run on all sites except those turned off from the toolbar
              popup.</span
            >
          </label>
          <label class="ui-switch">
            <input type="checkbox" id="enabled-by-default" />
            <span class="ui-switch__track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="setting-row">
          <label class="switch-label" for="theme-select">
            <span class="setting-title">Appearance</span>
            <span class="setting-desc"
              >Pick a light or dark look. On first run this follows your
              system.</span
            >
          </label>
          <div class="ui-select-field">
            <select id="theme-select" class="ui-select" aria-label="Appearance">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        </div>
        <div class="save-status" id="save-status" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
